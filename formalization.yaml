version: "v0.4"

project:
  name: "Gaussian fluctuations for Internal DLA on cylinders"
  description: >-
    A Lean 4 formalization of the paper "Gaussian fluctuations for Internal DLA on cylinders" by
    Bou-Rabee, Silvestri and Yadin (arXiv:2604.21142). All four main results are proved: the
    maximal fluctuation bound (Theorem 1.1, IdlaCyl.Frozen.max_fluct_v3), the Gaussian
    fluctuations of the occupation field (Theorem 1.3, IdlaCyl.Frozen.gff_v3), and its cycle and
    torus examples (IdlaCyl.Frozen.thm_cycle_v3, IdlaCyl.Frozen.thm_torus_v3), together with every
    lemma and proposition that their proofs use. The two results the paper cites are proved as
    well: McLeish's martingale central limit theorem, in Lattice-Probability, and Silvestri's
    Proposition 2, in IdlaCyl/Support/Silvestri/. The printed proof of the reduction pr:reduction
    has a gap; the printed statement is proved by a different argument, together with three
    statements that are stronger than the published one and are not in the paper. The four main
    theorems are independently checked by the comparator pairs under IdlaCylAudit/.
  authors:
    - "Ahmed Bou-Rabee"
  responsible_maintainers:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

classification:
  arxiv: ["math.PR"]
  msc2020: ["60K35", "82C24", "60F05"]

sources:
  - title: "Gaussian fluctuations for Internal DLA on cylinders"
    authors:
      - "Ahmed Bou-Rabee"
      - "Vittoria Silvestri"
      - "Ariel Yadin"
    id: "arXiv:2604.21142"
    url: "https://arxiv.org/abs/2604.21142"
    type: "paper"
    relationship: "formalizes"
    location: "paper/"
    note: >-
      The paper under formalization. Its arXiv source, bibliography, figures and compiled PDF are
      included under paper/; the source paper/idla-cylinder-gff.tex is pinned by its SHA-256
      34a459e11753efc825c7a7b0534bb90598fc94a20f32ce8c7d53135c028e7701 in ledger/manifest.yaml, and
      every frozen statement quotes the lines of that version it states.
    license: "arXiv non-exclusive distribution license 1.0; included in paper/ with the authors' permission; the publication licence is not set by the software licence"
    author_endorsement: "participated"
  - title: "Internal DLA on cylinder graphs: fluctuations and mixing"
    authors:
      - "Vittoria Silvestri"
    id: "Electron. Commun. Probab. 25 (2020), paper 61"
    type: "paper"
    relationship: "cites"
    note: >-
      Proposition 2 is cited by the paper; it is stated as IdlaCyl.External.silvestri_prop2 and
      proved as IdlaCyl.External.silvestri_prop2_proved.
  - title: "Dependent central limit theorems and invariance principles"
    authors:
      - "D. L. McLeish"
    id: "Ann. Probab. 2 (1974)"
    type: "paper"
    relationship: "cites"
    note: >-
      Theorem 2.3 is cited by the paper; it is stated as IdlaCyl.External.martingale_clt_v2 and
      proved from LatticeProb.McLeish.tendstoInDistribution_martingale_clt.

related_formalizations:
  - id: "https://github.com/nitromannitol/Lattice-Probability"
    relationship: "builds-on"
    note: >-
      Lattice-Probability (LatticeProb), a git dependency pinned to commit
      fcfd4332bc9051cf5a6bbabe73e334df3bf28e76. It supplies McLeish's martingale central limit
      theorem and Freedman's and Bernstein's inequalities, from which the concentration
      inequalities of IdlaCyl/External/Discharge/ are derived.

status:
  scope: >-
    Theorems 1.1 and 1.3 of the paper and its cycle and torus examples, each stated as in the
    paper on the canonical IDLA model, with every supporting lemma and proposition of their
    proofs and the two cited results. Every node is registered in ledger/manifest.yaml with the
    hash of its statement, and no registered statement is open. Three registered statements
    strengthen pr:reduction beyond the paper.
  sorry_count: 0
  sorry_count_scope: "the IdlaCyl library"
  comparator_challenge_sorry_count: 4
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "IdlaCyl.Frozen.max_fluct_v3"
      file: "IdlaCyl/Frozen/MaxFluctV3.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "IdlaCylAudit/MaxFluct/comparator.json"
      literature_dependencies: []
    - declaration: "IdlaCyl.Frozen.gff_v3"
      file: "IdlaCyl/Frozen/GFFV3.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "IdlaCylAudit/GFF/comparator.json"
      literature_dependencies: []
    - declaration: "IdlaCyl.Frozen.thm_cycle_v3"
      file: "IdlaCyl/Frozen/ThmCycleV3.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "IdlaCylAudit/Cycle/comparator.json"
      literature_dependencies: []
    - declaration: "IdlaCyl.Frozen.thm_torus_v3"
      file: "IdlaCyl/Frozen/ThmTorusV3.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "IdlaCylAudit/Torus/comparator.json"
      literature_dependencies: []

