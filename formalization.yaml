  spend_usd: "not tracked"
  notes: >-
    The Lean code was written with AI assistance under the direction of the author, who fixed the
    statements to be formalized. Every proof is checked by the Lean kernel and Mathlib, and the
    libraries contain no sorry and no custom axiom. The four Mathlib-only comparator challenge
    files (IdlaCylAudit/*/Challenge.lean) each contain exactly one intentional statement-level
    sorry, which the corresponding Solution.lean proves and leanprover/comparator checks. The
    model versions listed above are the ones recorded during the work; wall time and spend were
    not tracked.

fidelity:
  divergences: >-
    Each frozen statement quotes the lines of paper/idla-cylinder-gff.tex it states. The
    differences from the paper are recorded in ledger/ERRATA.md: the first encodings that did not
    state the paper's results and their successors (E1-E10, E19, E20), Bernstein's inequality
    with its factor 2 and a measurability hypothesis (E15, E17), the starting-site hypothesis of
    the stopped cluster (E16), the reading of clm:Q-W for N large (E19), the proof of pr:reduction
    by a different argument and its three stronger forms (E18), and the encoding of Silvestri's
    Proposition 2 with a connected initial cluster, restricted to vertex-transitive bases and with
    an added cutoff N0 on the size of the base (E21). Convergence in distribution is stated
    through bounded continuous test functions, and probability bounds are stated for the
    complementary event.

review:
  status: "model review"
  reviewers:
    - "Claude Opus 5.5, separate read-only reviews of the statements, the cited results, the replaced first encodings and the publication tree against the paper (2026-10-19)"
    - "Claude Opus 5.5, separate read-only check of the written proof of the block reduction and its quantitative strengthening (2026-10-19)"
  notes: >-
    Correctness of every proof is guaranteed by the Lean kernel and Mathlib (no sorry, no custom
    axiom). The statements were compared with the paper in separate, read-only Claude Opus 5.5
    reviews, and the four main statements are checked by the Mathlib-only comparator pairs. This
    is not external peer review.

