        leanprover/lean4:v4.32.0, Mathlib 81a5d257c8e410db227a6665ed08f64fea08e997 and
        Lattice-Probability at a pinned revision. Every change was checked by the manifest, axiom
        and warning checks of tools/.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local Linux machine"
      prompting_notes: >-
